name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp commit hash and time into the page
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll
          SHA=$(git rev-parse --short HEAD)
          FULL=$(git rev-parse HEAD)
          WHEN=$(git log -1 --format=%cI)
          sed -i "s/__BUILD_SHA__/$SHA/g; s/__BUILD_FULL_SHA__/$FULL/g; s/__BUILD_TIME__/$WHEN/g" _site/index.html
          grep -o 'name="build-[a-z-]*" content="[^"]*"' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

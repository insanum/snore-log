name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build: copy the web app and stamp the commit hash and time into it, then upload it for Pages.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp commit hash and time into the page
        run: |
          mkdir -p _site
          cp -R web/. _site/
          touch _site/.nojekyll
          SHA=$(git rev-parse --short HEAD)
          FULL=$(git rev-parse HEAD)
          WHEN=$(git log -1 --format=%cI)
          # Stamp every page: the web app shows it, and the home page carries it so older copies of the app notice updates.
          find _site -name "*.html" -exec sed -i "s/__BUILD_SHA__/$SHA/g; s/__BUILD_FULL_SHA__/$FULL/g; s/__BUILD_TIME__/$WHEN/g" {} +
          grep -o 'name="build-[a-z-]*" content="[^"]*"' _site/index.html _site/app/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploy: a separate job, so the upload is fully registered before Pages looks for it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
